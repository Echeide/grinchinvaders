<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Rocket Body -->
    <path d="M50 10 L80 80 Q50 90 20 80 Z" fill="#ec615d" stroke="#ffd53e" stroke-width="2"/>
    <!-- Window -->
    <circle cx="50" cy="45" r="15" fill="#87CEEB" stroke="#F1F5F9" stroke-width="2"/>
    <!-- Grinch Face (Simplified) -->
    <circle cx="50" cy="45" r="10" fill="#76B947"/> <!-- Grinch Green -->
    <path d="M45 42 Q50 48 55 42" fill="none" stroke="#1f2b51" stroke-width="1"/> <!-- Smile -->
    <circle cx="46" cy="40" r="1" fill="#ffd53e"/> <!-- Eyes -->
    <circle cx="54" cy="40" r="1" fill="#ffd53e"/>
    <!-- Fins -->
    <path d="M20 80 L10 95 L30 85 Z" fill="#ec615d" stroke="#ffd53e" stroke-width="1"/>
    <path d="M80 80 L90 95 L70 85 Z" fill="#ec615d" stroke="#ffd53e" stroke-width="1"/>
    <!-- Flame -->
    <path d="M40 85 Q50 100 60 85" fill="#ffd53e" opacity="0.8">
        <animate attributeName="d" values="M40 85 Q50 100 60 85; M42 85 Q50 110 58 85; M40 85 Q50 100 60 85" dur="0.5s" repeatCount="indefinite"/>
    </path>
</svg>
